# Weekly dependency-update PRs.
#
# The commit-message prefixes make every Dependabot subject a valid Conventional
# Commit ("build(deps): bump numpy …", "ci(deps): bump actions/checkout …"), so
# the PRs pass .githooks/commit-msg and the commit-messages CI job unchanged.
# Bumps add no new dependency, so they need no justification in the PR.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
      include: "scope"
    # One PR for the routine bumps; each major version gets its own PR and review.
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
      include: "scope"
